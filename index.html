<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg-anim"></div>

  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-title">
        <svg class="icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        StudyForge
      </div>
      <div class="brand-sub">Master your Certifications</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" id="nav-dash" onclick="nav('dashboard')">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 3h7v7H3V3zm11 0h7v7h-7V3zM3 14h7v7H3v-7zm14 3a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Dashboard
      </button>
      <button class="nav-btn" id="nav-add" onclick="nav('add-course')">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
        Add Course
      </button>
      <div class="nav-spacer"></div>
      <button class="nav-btn nav-danger" onclick="resetAll()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 119 9M3 3v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Reset All Data
      </button>
      <div class="sidebar-footer">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v12h16V6H4z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 10h4M6 14h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Saved locally in browser
      </div>
    </nav>
  </aside>

  <button id="mobile-menu-btn" class="mobile-menu-btn" onclick="toggleSidebar()" title="Toggle menu">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <main id="app"></main>
  <div id="modal-overlay" onclick="if(event.target===this)hideModal()">
    <div id="modal-box"></div>
  </div>
  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
